<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Maildrop — админка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/admin.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='resources/favicon.ico') }}">
</head>
<body>
    <div class="container">
        <header class="header admin-header">
            <h1>
                <img src="{{ url_for('static', filename='resources/mail-icon.svg') }}" alt="Mail Icon">
                admin
            </h1>
            <div class="header-actions">
                <button type="button" id="tg-toggle" class="btn btn-secondary">Telegram</button>
                <form method="post" action="{{ url_for('admin.logout') }}">
                    <button type="submit" class="btn btn-secondary">Выйти</button>
                </form>
            </div>
        </header>

        <section id="tg-panel" class="email-panel" hidden>
            <div class="panel-header">
                <h2>Telegram</h2>
                <button type="button" id="tg-link" class="btn btn-primary btn-small" hidden>Привязать группу</button>
            </div>
            <p id="tg-status" class="tg-status"></p>
            <div id="tg-code-box" class="tg-code-box" hidden>
                <p>1. Добавьте бота <b id="tg-bot-name"></b> в группу и сделайте его администратором.</p>
                <p>2. Отправьте в группу эту команду, она действует 10 минут:</p>
                <button type="button" id="tg-code" class="code-chip" title="Скопировать команду"></button>
                <p>3. Группа появится ниже. Отметьте папки, коды с адресов которых она будет получать.</p>
            </div>
            <ul id="tg-chats" class="tg-chats"></ul>
        </section>

        <nav id="folder-bar" class="folder-bar"></nav>

        <section class="email-panel">
            <div class="panel-header">
                <h2 id="panel-title">Отслеживаемые адреса</h2>
                <div id="folder-actions" class="folder-actions" hidden>
                    <button type="button" id="folder-rename" class="btn btn-secondary btn-small">Переименовать</button>
                    <button type="button" id="folder-delete" class="btn btn-secondary btn-small btn-remove">Удалить папку</button>
                </div>
            </div>
            <form id="add-form" class="add-form">
                <input type="text" id="add-address" class="form-control" placeholder="name@{{ domains[0] }}" spellcheck="false" required>
                <input type="text" id="add-note" class="form-control" placeholder="Заметка (необязательно)" maxlength="100">
                <button type="submit" class="btn btn-primary">Добавить</button>
            </form>
            <p id="add-error" class="form-error"></p>
            <ul id="address-list" class="address-list"></ul>
            <p id="address-placeholder" class="admin-placeholder"></p>
        </section>

        <main class="inbox-section">
            <div class="inbox-header">
                <h2>Письма</h2>
                <button id="filter-reset" class="btn btn-secondary" hidden>Показать все адреса</button>
            </div>
            <ul id="feed-list"></ul>
            <p id="feed-placeholder" class="admin-placeholder"></p>
        </main>
    </div>
    <script src="{{ url_for('static', filename='scripts/admin.js') }}"></script>
</body>
</html>
