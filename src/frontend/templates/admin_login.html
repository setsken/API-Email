<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Maildrop — вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/admin.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='resources/favicon.ico') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <h1>
            <img src="{{ url_for('static', filename='resources/mail-icon.svg') }}" alt="">
            maildrop
        </h1>
        {% if not enabled %}
        <p class="form-error">Панель отключена: задайте переменную окружения ADMIN_PASSWORD.</p>
        {% else %}
        <p class="login-hint">Вход в панель по паролю</p>
        <form method="post" action="{{ url_for('admin.login') }}" class="login-form">
            <input type="password" name="password" class="form-control" placeholder="Пароль" aria-label="Пароль" autocomplete="current-password" autofocus required>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}
        {% endif %}
        <a class="login-back" href="{{ url_for('pages.index') }}">Временная почта</a>
    </main>
</body>
</html>
